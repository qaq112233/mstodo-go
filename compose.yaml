services:
  mstodo:
    image: ${MSTODO_IMAGE:-ghcr.io/qaq112233/mstodo-go:latest}
    restart: unless-stopped
    stop_grace_period: 80s
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?请在 .env 中填写公网 HTTPS 地址}
      LISTEN_ADDR: :8080
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - ${DATA_PATH:-./data}:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
